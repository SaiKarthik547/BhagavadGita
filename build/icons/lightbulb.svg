<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="metalGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888888;"/>
      <stop offset="25%" style="stop-color:#EFEFEF;"/>
      <stop offset="50%" style="stop-color:#BBBBBB;"/>
      <stop offset="100%" style="stop-color:#777777;"/>
    </linearGradient>

    <radialGradient id="glassGradient" cx="50%" cy="40%" r="60%" fx="65%" fy="35%">
      <stop offset="0%" style="stop-color:white; stop-opacity:0.8;"/>
      <stop offset="100%" style="stop-color:#e0e8f0; stop-opacity:0.2;"/>
    </radialGradient>
  </defs>

  <g transform="translate(0, 10)">

    <g id="base">
      <path d="M 70 120 L 70 155 Q 70 160 75 160 L 125 160 Q 130 160 130 155 L 130 120 Z" fill="url(#metalGradient)" />
      <rect x="70" y="130" width="60" height="4" rx="2" fill="#666666"/>
      <rect x="70" y="140" width="60" height="4" rx="2" fill="#666666"/>
      <path d="M 85 160 L 115 160 Q 120 160 120 165 L 120 170 Q 120 175 115 175 L 85 175 Q 80 175 80 170 L 80 165 Q 80 160 85 160 Z" fill="#444444"/>
    </g>

    <g id="glass">
      <path d="M 100,0 C 60,0 40,30 40,70 C 40,110 65,120 70,120 L 130,120 C 135,120 160,110 160,70 C 160,30 140,0 100,0 Z" fill="#FFFFCC" fill-opacity="0.3"/>
      <path d="M 100,0 C 60,0 40,30 40,70 C 40,110 65,120 70,120 L 130,120 C 135,120 160,110 160,70 C 160,30 140,0 100,0 Z" fill="url(#glassGradient)"/>
    </g>

    <g id="filament" filter="url(#glow)">
      <path d="M 90 120 L 90 90 L 80 75" stroke="#a0a0a0" stroke-width="2" fill="none"/>
      <path d="M 110 120 L 110 90 L 120 75" stroke="#a0a0a0" stroke-width="2" fill="none"/>
      <path d="M 80 75 Q 100 65 120 75" stroke="#FFD700" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <path d="M 65 25 A 40 40 0 0 1 95 20 A 30 30 0 0 1 105 55 A 40 40 0 0 0 65 25 Z" fill="white" fill-opacity="0.7"/>

  </g>
</svg>