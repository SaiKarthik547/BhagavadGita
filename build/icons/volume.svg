<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" style="background-color:transparent;">
  <defs>
    <filter id="volumeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="shadow"/>
      <feOffset dx="4" dy="4" in="shadow" result="offsetShadow"/>
      <feMerge>
        <feMergeNode in="offsetShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="speakerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;"/>
      <stop offset="50%" style="stop-color:#F0F0F0;"/>
      <stop offset="100%" style="stop-color:#909090;"/>
    </linearGradient>
    <radialGradient id="coneGradient">
      <stop offset="5%" stop-color="#333"/>
      <stop offset="95%" stop-color="#111"/>
    </radialGradient>
  </defs>
  <g filter="url(#volumeShadow)">
    <path d="M 30 75 L 60 75 L 95 40 L 95 160 L 60 125 L 30 125 Z" fill="url(#speakerGradient)"/>
    <path d="M 60 75 L 95 40 L 95 160 L 60 125 Z" fill="url(#coneGradient)"/>
    <g stroke-linecap="round" stroke-width="8" fill="none">
      <path d="M 120 75 C 130 90, 130 110, 120 125" stroke="url(#speakerGradient)" stroke-opacity="0.9"/>
      <path d="M 140 60 C 155 90, 155 110, 140 140" stroke="url(#speakerGradient)" stroke-opacity="0.6"/>
      <path d="M 160 45 C 180 90, 180 110, 160 155" stroke="url(#speakerGradient)" stroke-opacity="0.3"/>
    </g>
    <path d="M 35 80 L 55 80 L 90 50 L 90 55 L 58 85 L 35 85 Z" fill="none" fill-opacity="0.5"/>
  </g>
</svg>
