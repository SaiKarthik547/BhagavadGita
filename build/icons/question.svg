<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="shadow"/>
      <feOffset dx="3" dy="4" in="shadow" result="offsetShadow"/>
      <feMerge>
        <feMergeNode in="offsetShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6E8EFB; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A777E5; stop-opacity:1" />
    </linearGradient>

    <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white; stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:white; stop-opacity:0;" />
    </linearGradient>
  </defs>

  <g filter="url(#dropShadow)">

    <path
      d="M 100,20
         C 60,20 50,60 70,85
         S 100,105 100,120
         L 100,135"
      fill="none"
      stroke="url(#mainGradient)"
      stroke-width="30"
      stroke-linecap="round"
    />

    <circle
      cx="100"
      cy="165"
      r="15"
      fill="url(#mainGradient)"
    />

    <path
      d="M 100,35
         C 75,35 70,60 80,75"
      fill="none"
      stroke="url(#highlightGradient)"
      stroke-width="12"
      stroke-linecap="round"
    />

  </g>
</svg>